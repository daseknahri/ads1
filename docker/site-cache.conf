<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType font/woff2 "access plus 1 year"
  ExpiresByType image/webp "access plus 1 month"
  ExpiresByType image/jpeg "access plus 1 month"
  ExpiresByType image/png "access plus 1 month"
  ExpiresByType image/svg+xml "access plus 1 month"
  ExpiresByType image/x-icon "access plus 1 month"
  ExpiresByType text/css "access plus 1 month"
  ExpiresByType application/javascript "access plus 1 month"
  ExpiresByType text/javascript "access plus 1 month"
</IfModule>
<IfModule mod_headers.c>
  <FilesMatch "\.(woff2|webp|jpe?g|png|svg|ico|css|js)$">
    Header append Cache-Control "public"
  </FilesMatch>
</IfModule>
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript text/javascript application/json image/svg+xml
</IfModule>
# HTTP/2 (multiplexing) for TLS connections. Guarded: if the module failed to
# load, Apache stays on http/1.1 instead of refusing to start. php8.3-apache
# runs prefork + mod_php; mod_http2 works under prefork (event/worker would be
# better long-term but is a bigger, riskier change than this config-only step).
<IfModule mod_http2.c>
  Protocols h2 http/1.1
</IfModule>
